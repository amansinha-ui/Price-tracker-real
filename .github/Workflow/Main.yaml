name: Daily Price Tracker

on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  track-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run price tracker
        env:
          TRACKER_EMAIL: amankumarsinha2008@gmail.com
        run: |
          python pythonprice_tracker.py
